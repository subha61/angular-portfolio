  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let project of projects; let i = index">
      <div class="project-card">
        
        <!-- Image Section -->
        <!-- <div class="image-wrapper">
          <img src="https://picsum.photos/400/300?random=1" alt="Project Image" class="img-fluid rounded-top">
        </div> -->
        <div class="gradient-banner d-flex align-items-center justify-content-center">
            <span class="banner-text">{{ project.title | slice:0:2 | uppercase }}</span>
          </div>
  
        <!-- Hover Action Section -->
        <div class="action-bar text-center">
            <button class="btn-icon view" (click)="onView(project)">👁</button>
            <button class="btn-icon edit" (click)="onEdit(project)">✏️</button>
            <button class="btn-icon delete" (click)="onDelete(project)">🗑</button>
        </div>
  
        <!-- Content Section -->
        <div class="card-body text-center">
          <h5 class="project-title">{{ project.title }}</h5>
          <p class="project-desc">{{ project.description }}</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="price">{{ project.price }}</span>
            <small class="text-muted">
              <i class="bi bi-geo-alt"></i> {{ project.location }}
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
