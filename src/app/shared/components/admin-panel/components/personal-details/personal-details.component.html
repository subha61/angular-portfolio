<div class="profile-section py-4">
    <div class="container">
      <!-- Title with line -->
      <div class="d-flex align-items-center mb-3">
        <h5 class="fw-semibold text-dark mb-0 me-3 gradient-text">My Profile</h5>
        <div class="flex-grow-1 border-top"></div>
      </div>
  
      <!-- Profile Card -->
      <div class="card shadow-sm border-0 rounded-4 p-3 d-flex flex-row align-items-center mb-4">
        <!-- Profile Image -->
        <div class="position-relative me-3">
          <img 
            src="https://randomuser.me/api/portraits/men/32.jpg" 
            class="rounded-circle img-fluid profile-img" 
            alt="Profile"
          />
          <button class="btn btn-sm rounded-circle position-absolute upload-btn icon-color">
            <i class="bi bi-camera-fill text-white"></i>
          </button>
        </div>
  
        <!-- Profile Info -->
        <div>
          <h6 class="fw-semibold mb-1 gradient-text">Subhabrata Roy</h6>
          <p class="mb-1 text-muted small">Admin</p>
          <p class="mb-0 text-secondary small">Kolkata, India</p>
        </div>
      </div>
    </div>
    <div class="container">

      <!-- Personal Information -->
      <div class="card shadow-sm rounded-4 mb-4">
        <div class="card-header d-flex rounded-4 justify-content-between align-items-center bg-white border-0">
          <h5 class="section-title mb-0 gradient-text">Personal Information</h5>
          <button class="btn btn-edit">
            <i class="bi bi-pencil"></i> Edit
          </button>
        </div>
        <div class="border-bottom pb-2 fw-semibold text-dark mr-5 ml-5"></div>
        <div class="card-body">
          <div class="row gy-3">
            <div class="col-md-4">
              <label class="field-label">First Name</label>
              <div class="field-value">Natashia</div>
            </div>
            <div class="col-md-4">
              <label class="field-label">Last Name</label>
              <div class="field-value">Khaleira</div>
            </div>
            <div class="col-md-4">
              <label class="field-label">Date of Birth</label>
              <div class="field-value">12-10-1990</div>
            </div>
    
            <div class="col-md-4">
              <label class="field-label">Email Address</label>
              <div class="field-value">{{'info@gmail.com'}}</div>
            </div>
            <div class="col-md-4">
              <label class="field-label">Phone Number</label>
              <div class="field-value">(+62) 821 2554-5846</div>
            </div>
            <div class="col-md-4">
              <label class="field-label">User Role</label>
              <div class="field-value">Admin</div>
            </div>
          </div>
        </div>
      </div>
    
      <!-- Address -->
      <div class="card shadow-sm rounded-4">
        <div class="card-header rounded-4 d-flex justify-content-between align-items-center bg-white border-0">
          <h5 class="section-title gradient-text mb-0">Address</h5>
          <button class="btn btn-edit-light">
            <i class="bi bi-pencil"></i> Edit
          </button>
          </div>
        <div class="border-bottom pb-2 fw-semibold text-dark mr-5 ml-5"></div>
        <div class="card-body">
          <div class="row gy-3">
            <div class="col-md-4">
              <label class="field-label">Country</label>
              <div class="field-value">United Kingdom</div>
            </div>
            <div class="col-md-4">
              <label class="field-label">City</label>
              <div class="field-value">Leeds, East London</div>
            </div>
            <div class="col-md-4">
              <label class="field-label">Postal Code</label>
              <div class="field-value">ERT 1254</div>
            </div>
          </div>
        </div>
      </div>
    
    </div>
    
  </div>
